spring:
  application:
    name: expense-manager

  datasource:
    url: jdbc:postgresql://localhost:5432/expense_manager
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc.time_zone: UTC

  flyway:
    enabled: false

server:
  port: 8080